bio_zh: 林李泽强，博士、讲师、硕士生导师。2022年6月毕业于湖南师范大学统计学专业，获理学博士学位，同年7月加入广东外语外贸大学。主要从事计算神经影像学研究，聚焦脑连接组方法的开发与应用。近年来在
  *Communications Biology*、*NeuroImage*、*Psychological Medicine*等国内外期刊发表论文20余篇。主持教育部人文社会科学研究青年基金、广东省哲学社会科学规划项目、广州市基础研究计划基础与应用基础研究项目、广东省普通高校特色创新项目等多项科研项目；主持2项校级质量工程项目；参与多项国家级和省部级教学与科研项目。撰写的案例入选“全国应用统计专业学位教育教学案例库”。重视学生科研训练，近三年指导学生获批国家级、省级大学生创新创业训练计划项目7项，并在国家级、省级学科竞赛中获奖近30项。
bio_en: Ze-Qiang Linli is a lecturer and master’s supervisor. He received his PhD
  in Statistics from Hunan Normal University in June 2022 and joined Guangdong University
  of Foreign Studies in July of the same year. His research focuses on computational
  neuroimaging, with an emphasis on developing and applying methods for brain connectome
  analysis. He has published more than 20 papers in journals including *Communications
  Biology*, *NeuroImage* and *Psychological Medicine*. He leads research projects
  supported by the Ministry of Education’s Humanities and Social Sciences Youth Fund,
  the Guangdong Philosophy and Social Sciences Planning Program, the Guangzhou Basic
  and Applied Basic Research Program, and the Guangdong Higher Education Characteristic
  Innovation Program. He also leads two university-level quality enhancement projects
  and participates in national and provincial or ministerial teaching and research
  projects. A case study he authored was selected for the national teaching case repository
  for professional graduate education in applied statistics. He places strong emphasis
  on student research training. Over the past three years, students under his supervision
  have secured seven national or provincial undergraduate innovation and entrepreneurship
  training projects and won nearly 30 awards in national or provincial academic competitions.
bio_source: Owner-confirmed wording, 2026-10-28
team_purpose_zh: 课题组长期组织论文讨论班，围绕真实科研问题开展研究，培养学生提出问题、分析数据和清晰表达研究结果的能力。研究与训练融合统计学、数学、机器学习和脑科学，注重扎实的方法训练与科研素养的培养。
team_purpose_en: Our group holds regular paper discussion seminars and works on real
  research questions to help students develop the ability to formulate questions,
  analyze data and communicate findings clearly. Our research and training bring together
  statistics, mathematics, machine learning and brain science, emphasizing sound methodological
  training and the development of research skills and judgment.
team_members_zh: 课题组目前包括6名统计学或应用统计专业硕士研究生，以及6–8名来自应用心理学、数学、统计学专业的优秀本科生。
team_members_en: The group currently includes six master’s students in Statistics
  or Applied Statistics and six to eight outstanding undergraduates in Applied Psychology,
  Mathematics or Statistics.
team_recruitment_zh: 招收统计学学术型硕士和应用统计专业型硕士。欢迎数学、统计学、计算机、心理学、医学及相关专业学生联系交流，尤其欢迎对脑影像统计、脑网络与机器学习感兴趣的同学。本科低年级学生也可参与科研，不要求已有脑影像研究经验。对于长期参与科研的同学，将在研究选题、数据分析、统计与编程方法及论文写作等方面提供系统指导。
team_recruitment_en: I supervise academic master’s students in Statistics and professional
  master’s students in Applied Statistics. Students from mathematics, statistics,
  computer science, psychology, medicine and related disciplines are welcome to get
  in touch, especially those interested in statistical neuroimaging, brain networks
  and machine learning. Undergraduates may begin research early in their studies;
  prior neuroimaging experience is not required. Students who participate in research
  over the longer term receive systematic guidance in choosing research topics, analyzing
  data, applying statistical and programming methods, and writing academic papers.
