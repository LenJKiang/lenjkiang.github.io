research_overview_zh: 长期从事计算神经影像学研究，结合多模态脑影像数据（fMRI、sMRI、dMRI）与统计学、数学及机器学习方法，开展脑连接组方法的开发与应用研究，重点关注精神疾病、物质依赖和语言学习相关的脑机制。
research_overview_en: My research focuses on computational neuroimaging. I combine
  multimodal brain imaging data (fMRI, sMRI and dMRI) with statistical, mathematical
  and machine learning methods to develop and apply approaches to brain connectome
  analysis, with a focus on the brain mechanisms underlying psychiatric disorders,
  substance dependence and language learning.
teaching_overview_zh: 面向经管类、应用心理学等专业本科生讲授《概率论》《统计学》，面向经济统计学专业本科生讲授《R语言》，并为应用统计、统计学专业硕士研究生讲授《论文写作指导》《案例实务》等课程。
teaching_overview_en: I teach Probability Theory and Statistics to undergraduates
  in economics, management, applied psychology and related disciplines; R Programming
  to undergraduates in Economic Statistics; and Academic Writing and Case Studies
  in Applied Statistics to master’s students in Applied Statistics and Statistics.
