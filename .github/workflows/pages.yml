# 用户于2026-10-28授权推送和部署；只发布公开白名单验证过的dist。
name: Build and deploy academic website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create private local working directories
        run: mkdir -p workspace/working workspace/reports workspace/review
      - name: Validate public metadata
        run: python scripts/validate_content.py
      - name: Exclude local maintenance documents from the repository
        run: python scripts/prepublish.py --staged
      - name: Resolve actual Pages path and build
        env:
          REPOSITORY: ${{ github.repository }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: python scripts/ci_build.py
      - name: Regression tests against actual build
        run: python -m unittest discover -s tests -v
      - name: Synthetic authorized PDF integration
        run: python scripts/test_fixture_build.py
      - name: Upload only validated static output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
